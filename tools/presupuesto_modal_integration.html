<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Integración Presupuesto — Ejemplo</title>
<style>
  body{font-family:Arial;background:#121212;color:#eee;padding:20px}
  .form{background:#1b1b1b;padding:16px;border-radius:8px;max-width:700px}
  label{display:block;margin:8px 0}
  input,textarea{width:100%;padding:8px;background:#0f0f0f;border:1px solid #333;color:#fff}
  button{padding:8px 12px;margin-top:8px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center}
  .modal-content{width:90%;max-width:1000px;height:80%;background:#111;padding:8px;border-radius:8px}
  iframe{width:100%;height:100%;border:0;border-radius:6px}
</style>
</head>
<body>
  <h2>Ejemplo: Editar trabajo (integración)</h2>
  <div class="form">
    <label>Nombre
      <input id="nombre" value="Producto 1">
    </label>
    <label>Material
      <input id="material">
    </label>
    <label>Tamaño
      <input id="tamanio">
    </label>
    <label>Cantidad
      <input id="cantidad" type="number" value="1">
    </label>
    <label>Subtotal
      <input id="subtotal" readonly>
    </label>
    <label>Notas
      <textarea id="notas" rows="4"></textarea>
    </label>
    <button id="openGenerator">Generar presupuesto</button>
    <button id="applyFromNotes">Aplicar notas al formulario</button>
  </div>

  <div id="modal" class="modal" style="display:none">
    <div class="modal-content">
      <iframe id="generatorFrame" src="presupuesto_ui.html"></iframe>
    </div>
  </div>

<script>
// Abrir modal con iframe
const modal = document.getElementById('modal');
const openBtn = document.getElementById('openGenerator');
openBtn.addEventListener('click', ()=>{ modal.style.display = 'flex'; });

// Cerrar modal si clic fuera del contenido
modal.addEventListener('click', (e)=>{ if(e.target===modal) modal.style.display='none'; });

// Escuchar mensajes desde el iframe (presupuesto)
window.addEventListener('message', (ev)=>{
  try{
    const data = ev.data;
    if(data && data.type === 'presupuesto_generated'){
      const txt = data.text || '';
      // Rellenar Notas con el mensaje completo
      document.getElementById('notas').value = txt;
      // Intentar extraer total y rellenar Subtotal
      const m = txt.match(/• Precios totales:\s*\$?([0-9.,]+)/i);
      if(m){
        const total = m[1].replace(/,/g,'');
        document.getElementById('subtotal').value = '$' + Number(total).toFixed(2);
      }
      // Cerrar modal
      modal.style.display = 'none';
    }
  }catch(e){ console.error(e); }
});

// Botón para copiar manualmente notas al formulario (demo)
document.getElementById('applyFromNotes').addEventListener('click', ()=>{
  const notas = document.getElementById('notas').value;
  alert('Notas aplicadas. (Demo)');
});
</script>
</body>
</html>
